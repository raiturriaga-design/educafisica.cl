const LESSONS={
'Habilidades motrices':{skill:'combinar desplazamientos, saltos y lanzamientos con control',warm:'Juego de señales: caminar, detenerse con equilibrio y cambiar de dirección al observar una tarjeta. Cada estudiante elige una velocidad cómoda.',tasks:['Islas de equilibrio: recorrer marcas separadas y mantener una posición estable durante tres segundos; elegir apoyos amplios o un recorrido más corto.','Caminos y blancos: desplazarse entre conos, detenerse y lanzar un objeto liviano hacia un blanco cercano. Alternar recorrido y lanzamiento sin filas largas.'],game:'En equipos pequeños, diseñar un recorrido de tres acciones (desplazarse, equilibrarse y lanzar). Cada integrante propone una variante y muestra cómo resolverla con seguridad.',indicator:'Combina las acciones de desplazarse, detenerse y lanzar manteniendo el control corporal.',decision:'Elige una ruta y ajusta su velocidad para completar el recorrido sin invadir el espacio de otra persona.',safe:'Separar recorridos, usar superficies estables y objetos livianos. Ofrecer una alternativa sin salto.',noEquipment:'Recorrido corporal sin implementos: caminar siguiendo líneas del suelo, detenerse en equilibrio y simular un lanzamiento a un compañero. El desafío es combinar tres acciones y explicar su orden.'},
'Básquetbol':{skill:'pasar, recibir y ocupar un espacio libre para dar continuidad al juego',warm:'En parejas, desplazarse frente a frente y copiar cambios de dirección. Añadir bote suave si hay balones, con mirada al espacio y distancia entre parejas.',tasks:['Pase y recepción: parejas a 2–4 m, manos preparadas, orientar el balón al pecho del compañero y amortiguar la recepción. Tras cada pase, cambiar a una marca libre.','Triángulo de apoyos: grupos de tres o cuatro, pasar y desplazarse al cono desocupado. El receptor indica una opción de pase con la mano; alternar roles.'],game:'Juego 3 contra 3 en media cancha: conseguir tres pases antes de intentar un lanzamiento cercano. No se permite arrebatar el balón de las manos. Rotar al observador para que registre una buena decisión y luego participe.',indicator:'Orienta el pase a su compañero y recibe con control en situaciones de práctica.',decision:'Se desplaza a un espacio libre después de pasar y ofrece una línea de apoyo.',safe:'Prohibir empujones y contacto al lanzamiento, delimitar canchas y comprobar el estado del suelo. Ajustar la altura del blanco y el tamaño del balón.',noEquipment:'Juego de apoyos sin balón: grupos de tres, una persona señala a quién pasaría y se desplaza a un espacio libre; el receptor muestra las manos y busca una nueva línea de apoyo. Rotar roles y observar la ocupación del espacio.'},
'Fútbol':{skill:'regular el pase con el pie y controlar la recepción para mantener la posesión',warm:'Desplazarse entre marcas sin contacto, alternando pasos cortos y cambios suaves de dirección. Con balón, tocarlo cerca del pie y detenerlo a una señal.',tasks:['Puertas de pase: parejas separadas por una puerta de conos; enviar el balón con el borde interno y controlarlo antes del siguiente pase. Ajustar ancho de la puerta y distancia.','Apoyo móvil: tríos, pasar a un compañero y ocupar un espacio libre. Recibir orientando el primer toque hacia la nueva dirección de juego.'],game:'Posesión 3 contra 1 con defensa de interceptación, sin barridas ni contacto. Cambiar defensor cada minuto y buscar apoyos por los costados. Reducir oposición o sumar un comodín según la necesidad.',indicator:'Utiliza una superficie de contacto apropiada y controla el balón cerca del cuerpo.',decision:'Busca un apoyo libre y orienta la recepción hacia una opción de continuidad.',safe:'Sin barridas, patadas altas ni contacto corporal. Separar zonas y adecuar la fuerza de pase al grupo.',noEquipment:'En tríos, ensayar recorridos de apoyo sin balón: quien inicia indica una dirección de pase, un compañero ofrece apoyo y otro representa una oposición pasiva a distancia. Explicar por qué la nueva posición facilita el pase.'},
'Vóleibol':{skill:'controlar la dirección del contacto y cooperar para mantener un móvil en juego',warm:'Movilidad suave de hombros y desplazamientos laterales cortos. En parejas, enviar y atrapar un balón liviano después de un bote, con distancia segura.',tasks:['Plataforma y dirección: enviar un balón liviano con antebrazos hacia una pareja cercana; permitir atrapar antes de reenviar. Ajustar altura y distancia.','Tres apoyos: grupos de tres, orientar el primer envío al centro y preparar al siguiente compañero. Alternar lanzamiento, recepción y contacto según nivel.'],game:'Mini vóleibol 2 contra 2 en campo reducido con cuerda baja. Permitir un bote o atrapar el primer contacto cuando sea necesario. Meta cooperativa: lograr una secuencia más larga que la anterior.',indicator:'Orienta la superficie de contacto hacia el objetivo y controla la fuerza del envío.',decision:'Se ubica para recibir y comunica quién interviene sin invadir el espacio del compañero.',safe:'Comprobar anclajes y zonas libres. Evitar choques debajo de la red y contactos fuertes con balones pesados.',noEquipment:'En parejas, una persona señala una trayectoria imaginaria y la otra se ubica y adopta la postura de recepción. Rotar y explicar cómo anticipar el lugar de llegada; practicar comunicación y desplazamientos sin saltos.'},
'Handbol':{skill:'pasar, recibir y desmarcarse para progresar hacia una zona de anotación',warm:'En parejas, desplazamientos suaves y giros orientados. Con balón, alternar recepción a dos manos y pase corto sin oposición.',tasks:['Pase al espacio: tríos en un rectángulo, pasar a un compañero que avanza hacia una marca libre. Frenar antes de enviar y mirar al receptor.','Superioridad 3 contra 1: conservar la posesión con defensa de interceptación. El poseedor busca dos apoyos; rotar defensor sin contacto.'],game:'Juego de zona 3 contra 3: anotar al recibir dentro de una zona final, con un máximo de tres pasos antes de pasar. No golpear ni sujetar al poseedor. Ajustar espacio y agregar un comodín.',indicator:'Realiza pases dirigidos y recibe orientando el cuerpo hacia la continuidad de la acción.',decision:'Se desmarca y decide entre avanzar o pasar según la ubicación de los apoyos.',safe:'Sin contacto, agarres ni lanzamientos al rostro. Usar pelota blanda y zonas finales libres de obstáculos.',noEquipment:'Juego de desmarques por señales: tres atacantes se desplazan para formar dos líneas de pase imaginarias frente a un observador que representa la defensa a distancia. Cambiar roles tras cada secuencia.'},
'Tenis':{skill:'coordinar un envío controlado y recuperar una posición de espera',warm:'Seguir con la mirada una pelota que bota, desplazarse con pasos cortos y detenerse antes de recibir. Si no hay pelota, responder a señales de una pareja.',tasks:['Bote y control: enviar una pelota liviana con la palma o una paleta hacia un blanco amplio, permitiendo un bote y una captura. Ajustar distancia antes de sumar continuidad.','Peloteo cooperativo: parejas a ambos lados de una línea, alternar envíos suaves y regresar al centro de su espacio después de cada acción.'],game:'Mini tenis cooperativo con un bote permitido: buscar cuatro envíos continuos antes de cambiar el desafío. Agregar dirección derecha/izquierda cuando exista control; mantener distancias amplias entre parejas.',indicator:'Coordina el contacto después del bote y dirige el móvil hacia un área delimitada.',decision:'Recupera la posición de espera y anticipa el desplazamiento según la trayectoria.',safe:'Separar zonas de golpeo, usar móviles blandos y mantener paletas lejos de compañeros. No compartir pasillos de circulación.',noEquipment:'En parejas, simular una trayectoria con señales de la mano. La otra persona realiza pasos de ajuste, un gesto controlado y recupera el centro. Observar equilibrio y anticipación, sin movimientos amplios cerca de otros.'},
'Condición física':{skill:'regular el esfuerzo y realizar movimientos controlados en un circuito variado',warm:'Caminar, movilizar articulaciones y aumentar gradualmente el ritmo. Explicar una escala simple de esfuerzo: suave, medio e intenso, con posibilidad de bajar el ritmo.',tasks:['Circuito de cuatro estaciones: caminar rápido o trotar suave; sentarse y levantarse de una superficie estable; apoyo de manos en pared; movilidad de brazos. Cada estudiante elige una variante accesible.','Repetir el recorrido con pausas de recuperación e hidratación. Comparar sensación de esfuerzo antes y después y ajustar la velocidad para sostener una ejecución controlada.'],game:'En parejas, diseñar un minicircuito de tres acciones y una pausa. Explicar qué acción trabaja resistencia, fuerza o movilidad. Compartirlo sin comparar marcas entre estudiantes.',indicator:'Realiza los movimientos con control y adapta la variante a sus posibilidades.',decision:'Reconoce su nivel de esfuerzo y ajusta la intensidad o la pausa para continuar con seguridad.',safe:'Sin pruebas máximas ni competencia por repeticiones. Respetar indicaciones individuales, ofrecer pausas y detener la tarea ante malestar.',noEquipment:'Circuito sin implementos: marcha activa, apoyos en pared, levantarse de una posición cómoda y movilidad. Elegir amplitud y ritmo; alternar movimiento y recuperación sin metas máximas.'},
'Resistencia':{skill:'mantener una actividad continua a un ritmo que permita regular el esfuerzo',warm:'Caminar con cambios graduales de ritmo y movilidad. Comprobar que el estudiante puede expresar cómo se siente antes de aumentar la intensidad.',tasks:['Recorridos a ritmo elegido: alternar marcha y trote suave en un circuito amplio, con una zona de recuperación accesible. La meta es regular el ritmo, no llegar primero.','En parejas, registrar sensación de esfuerzo con una escala de palabras o colores. Ajustar ritmo o pausa y comparar la sensación en un nuevo recorrido.'],game:'Desafío cooperativo de continuidad: recorrer juntos un trayecto manteniendo comunicación y un ritmo acordado. Cada pareja propone una pausa y explica cuándo la necesita.',indicator:'Sostiene la participación ajustando el ritmo y utiliza una alternativa de menor intensidad cuando lo necesita.',decision:'Describe su sensación de esfuerzo y propone un ajuste de ritmo o recuperación.',safe:'Asegurar agua, sombra y recorridos sin cruces. Respetar las indicaciones individuales y evitar pruebas máximas.',noEquipment:'Recorrido caminando o marcha en el lugar, con cambios de ritmo voluntarios y pausas de recuperación. Usar una escala de sensaciones para decidir cómo continuar.'},
'Fuerza':{skill:'ejecutar movimientos con el propio peso de forma controlada y ajustada a sus posibilidades',warm:'Movilidad articular y ensayos lentos de sentarse, levantarse y empujar una pared. Priorizar amplitud cómoda y estabilidad.',tasks:['Estaciones de control: empuje de pared, sentarse y levantarse de una superficie estable y elevación de talones con apoyo si es necesario. Practicar pocas repeticiones de calidad con pausas.','En parejas, observar un criterio por turno: apoyo estable, movimiento lento o respiración continua. Ofrecer una sugerencia concreta y volver a probar una variante cómoda.'],game:'Crear una secuencia de tres movimientos con recuperación entre ellos. Explicar por qué se eligió cada variante y mostrar una alternativa de menor exigencia.',indicator:'Controla la velocidad y mantiene apoyos estables en los movimientos practicados.',decision:'Selecciona una variante y una pausa que permiten sostener la calidad de la ejecución.',safe:'Sin cargas máximas ni contención de la respiración. Evitar dolor y respetar apoyos y rangos cómodos de cada estudiante.',noEquipment:'Elegir movimientos de empuje de pared, elevación de talones y levantarse de una posición cómoda. Ajustar apoyos y amplitud; la meta es control, no cantidad.'},
'Velocidad':{skill:'responder a una señal y acelerar o frenar de manera controlada',warm:'Caminar, cambiar de dirección y realizar aceleraciones progresivas cortas. Ensayar una frenada suave antes de la marca final.',tasks:['Salidas por señales: en carriles separados, responder a un color o gesto y recorrer 5–10 m según espacio y edad. Recuperar caminando por un pasillo distinto.','Frenada y decisión: avanzar a una señal y detenerse antes de un límite amplio. Variar estímulos sin sumar velocidad hasta lograr control.'],game:'Relevo cooperativo sin eliminación: cada integrante responde a una señal y entrega el turno al volver caminando. El grupo observa salidas seguras y respeto por los carriles, sin comparar a los estudiantes.',indicator:'Inicia la acción tras la señal y realiza una frenada controlada dentro de su espacio.',decision:'Distingue la señal de salida y mantiene el recorrido acordado sin invadir otros carriles.',safe:'Dejar una zona amplia para desacelerar. Evitar carreras hacia paredes y superficies resbaladizas. En espacios pequeños, reemplazar carrera por pasos rápidos en el lugar.',noEquipment:'Respuesta motriz por gestos: alternar dos pasos rápidos y una postura estable. Cambiar la señal y explicar la decisión tomada. Practicar en el lugar cuando no haya distancia de frenado.'},
'Coordinación':{skill:'ajustar la secuencia y la dirección de sus movimientos a señales y ritmos',warm:'Juego del espejo: una pareja propone movimientos lentos y la otra los reproduce. Cambiar roles y elegir una amplitud cómoda.',tasks:['Secuencia de tres acciones: paso lateral, apoyo y palmada. Practicar lento, invertir el orden y elegir una señal para iniciar.','Zigzag por marcas: alternar dirección a una señal visual y detenerse con control. Ofrecer trazos amplios o realizar la secuencia sentado según necesidad.'],game:'En grupos de cuatro, crear una secuencia compartida de cuatro acciones, mostrarla al grupo y enseñar una variante accesible. La meta es coordinarse y explicar el patrón.',indicator:'Sigue una secuencia motriz manteniendo el orden y ajustando su movimiento a la señal.',decision:'Reconoce cambios de dirección o ritmo y modifica su acción sin perder el control.',safe:'Marcar espacio personal, comenzar lento y evitar cruces. Permitir practicar sin música o con señales visuales.',noEquipment:'Secuencias de pasos, apoyos y palmadas a partir de señales de una pareja. Ofrecer la misma secuencia con movimientos de brazos desde una posición estable.'},
'Folclore y danza':{skill:'interpretar una secuencia rítmica y coordinarla respetuosamente con otras personas',warm:'Explorar pulsos con palmas y pasos cortos. Copiar una secuencia simple y alternar quién propone, sin exigir contacto físico.',tasks:['Reconocer el pulso: caminar o mover brazos a un ritmo; repetir una frase de cuatro u ocho tiempos y describir dónde comienza.','Secuencia en parejas o grupos: practicar pasos básicos y desplazamientos de una danza elegida por el docente, contextualizando su origen y sentido cultural. Ajustar recorridos y permitir versiones sin giro.'],game:'Crear y presentar una secuencia breve con inicio y cierre claros. El grupo observador identifica el pulso y destaca una decisión de coordinación, sin juzgar cuerpos ni expresividad personal.',indicator:'Mantiene el pulso y reproduce la secuencia acordada con control de sus desplazamientos.',decision:'Coordina entradas, cambios y cierre con su grupo mediante señales acordadas.',safe:'Ofrecer participación individual y alternativas sin giros o saltos. Respetar preferencias de contacto, cultura y expresión personal.',noEquipment:'Usar palmas, percusión corporal suave y pasos o movimientos de brazos. Crear una frase de ocho tiempos y enseñarla al grupo con señales visuales.'}

 ['Pase a la zona','Handbol','Pasar, desmarcarse y recibir dentro de una zona final.','Intermedio',15,'ball'],
 ['Mini tenis cooperativo','Tenis','Dirigir una pelota liviana y recuperar el centro de un campo pequeño.','Básico',15,'target'],
 ['Pulso y secuencia','Folclore y danza','Crear una secuencia de ocho tiempos con pasos y palmas.','Básico',12,'users'],
 ['Ritmo que puedo sostener','Resistencia','Alternar marcha y trote suave regulando la sensación de esfuerzo.','Básico',15,'run'],
 ['Fuerza con control','Fuerza','Elegir variantes de empuje y apoyo con el propio peso corporal.','Intermedio',15,'shield']

const ACTIVITIES=[...ORIGINAL_ACTIVITIES.map((a,i)=>({id:'act-'+i,name:a[1],content:i===19?'Folclore y danza':a[1]==='Estaciones de fuerza'?'Fuerza':a[1]==='Relevos de velocidad'?'Velocidad':a[2],description:a[3],level:a[4],minutes:parseInt(a[5])||15,icon:i<9?'ball':i>=12?'users':'run'})),...EXTRA_ACTIVITIES.map((a,i)=>({id:'extra-'+i,name:a[0],content:a[1],description:a[2],level:a[3],minutes:a[4],icon:a[5]}))];
function pedagogy(b){
 const lesson=LESSONS[b.content]||LESSONS['Habilidades motrices'],grade=DATA.courses.indexOf(b.course)+1,young=grade<=2,early=grade<=4,older=grade>8;
 const selected=ACTIVITIES.find(a=>a.id===b.activityId),o=DATA.oa.find(x=>x.course===b.course&&x.code===b.oaCode),small=['Sala','Espacio reducido'].includes(b.space),none=/sin (implement|material|balon|equipo)|ningun|ningún/.test(norm(b.material));
 const groups=b.students<4?'Trabajar de forma individual o en pareja, con acompañamiento docente.':`Organizar ${Math.ceil(b.students/(young?3:4))} grupos de ${young?'hasta tres':'hasta cuatro'} estudiantes, según asistencia; rotar roles y evitar filas.`;
 const bloom={Comprender:`Explicar con sus palabras cómo ${lesson.skill}`,Aplicar:`Aplicar estrategias para ${lesson.skill}`,Analizar:`Analizar dos opciones para ${lesson.skill} y justificar su elección`,Evaluar:`Evaluar su desempeño al ${lesson.skill} usando un criterio acordado`,Crear:`Crear una secuencia o solución para ${lesson.skill}`}[b.bloom]||`Practicar cómo ${lesson.skill}`;
 const age=young?'Dar una consigna por vez, demostrar con imágenes o gestos y usar juegos cortos sin eliminación.':early?'Combinar dos acciones, permitir ensayos y usar reglas simples de juego predeportivo.':older?'Acordar roles autónomos, justificar las decisiones y ajustar una estrategia a partir de la observación entre pares.':'Incorporar decisiones y oposición progresiva; rotar roles de participante y observador con criterios claros.';
 const space=small?'Espacio reducido: distribuir estaciones fijas y turnos activos, sustituir carreras por marcha o movimientos en el lugar y reemplazar envíos largos por gestos o pases suaves a corta distancia. Evitar trayectorias cruzadas.':`Delimitar zonas de práctica en ${b.space.toLowerCase()}, dejando pasillos de circulación y áreas de recuperación.`;
 const axis=o?.axis||'';let objective=`Al finalizar la clase, las y los estudiantes podrán ${bloom.charAt(0).toLowerCase()+bloom.slice(1)}, en una tarea adaptada a su nivel y con participación segura. Se observará el control de la acción y la explicación de una decisión.`;
 if(axis==='Vida activa y saludable')objective+=` Vincularán esta práctica con la regulación del esfuerzo o el autocuidado, según el OA ${b.oaCode}.`;
 if(/Seguridad|Responsabilidad/.test(axis))objective=`Al finalizar la clase, las y los estudiantes podrán participar en ${b.content.toLowerCase()} asumiendo roles, acordando reglas y demostrando autocuidado. Explicarán una acción que favorece la participación segura de su equipo, vinculada al OA ${b.oaCode}.`;
 const chosen=selected?`Actividad elegida: «${selected.name}». ${selected.description}\n`:'',focus=b.focus?`\nFoco del curso: ${b.focus}\nAcordar antes de comenzar una señal o evidencia concreta que permita observar este foco durante la tarea.`:'';
 return {objective,start:`Comunicar el propósito y mostrar dos criterios de éxito: control de la acción y decisiones seguras. Preguntar qué experiencia previa tiene el grupo.\n${none?lesson.noEquipment:lesson.warm}\n${age}`,
 practice:`${groups}\n${chosen}${none?lesson.noEquipment:lesson.tasks.map((t,i)=>`${i+1}. ${t}`).join('\n')}\nProgresión: primero sin oposición y con demostración; aumentar una sola dificultad cuando exista control.\n${space}${focus}`,
 apply:`${none?lesson.noEquipment:lesson.game}\n${young?'Observar y nombrar una acción lograda; acompañar las decisiones con preguntas simples.':older?'Comparar dos decisiones del juego o desafío, justificar su efecto y volver a probar una mejora.':'Pausar el juego para preguntar qué opción facilita la tarea, probarla y contrastar el resultado.'}\n${small?'Mantener grupos en sus zonas y aplicar la variante de baja amplitud descrita en la práctica.':''}`,
 close:`Reducir gradualmente el ritmo y realizar movilidad suave o respiración cómoda. Dar tiempo para hidratarse.\nTicket de salida: ${young?'mostrar o nombrar una acción que aprendió y una norma que ayudó al grupo.':'¿Qué decisión me ayudó hoy? ¿Qué evidencia tengo? ¿Qué cambiaré en el próximo intento?'}\nAutoevaluación: lo realizo con autonomía / con una ayuda / necesito otro ensayo.`,
 indicators:[lesson.indicator,lesson.decision,'Participa con una opción adecuada a sus posibilidades y utiliza la retroalimentación.','Coopera, respeta los acuerdos y aplica las medidas de seguridad.'],
 adaptation:`Ofrecer demostración visual y oral, distintas distancias o amplitudes y más tiempo de respuesta. Permitir la ejecución desde una posición estable y elegir una variante accesible sin excluir al estudiante. ${age}${b.inclusion?'\nAjustes indicados por el docente: '+b.inclusion:''}`,
 safety:lesson.safe+' '+space,assessment:`Observación de dos intentos, con un criterio por turno. Registrar evidencia concreta de control, decisión y participación, dar una sugerencia breve y ofrecer un nuevo intento. Criterios sugeridos: ajustar a la vinculación curricular y al contexto del curso.`,
 challenge:focus.trim(),times:timeDistribution(b.duration)};
}
function timeDistribution(total){const start=Math.max(5,Math.round(total*.15)),close=Math.max(5,Math.round(total*.15));return [start,total-start-close,close]}
const editable=(key,text)=>`<p class="doc-edit" data-edit="${key}" ${editDraft?'contenteditable="true" spellcheck="true"':''} aria-label="${esc('Editar '+key)}">${esc(text)}</p>`;
function planHTML(b){

let evalContext={course:DATA.courses[4],activity:'',oaCode:'',count:4,type:'rubric',classId:null,students:''};
function criteriaFor(content,n){
 const l=LESSONS[content]||LESSONS['Habilidades motrices'];
 return [
 {name:'Control de la ejecución',evidence:l.indicator,levels:['Realiza la acción con control y ajusta la ejecución de forma autónoma ante variaciones.','Realiza la acción con control en la situación practicada y corrige con una indicación breve.','Realiza parte de la acción; necesita demostraciones o recordatorios para mantener el control.','Con las oportunidades y apoyos ofrecidos, aún requiere guía frecuente para organizar la acción.']},
 {name:'Decisiones en la tarea',evidence:l.decision,levels:['Elige una opción pertinente, explica su efecto y la adapta al cambiar la situación.','Elige una opción pertinente en la situación practicada y explica una razón.','Reconoce una opción con preguntas o pistas; su elección todavía es poco consistente.','Necesita opciones guiadas para decidir y un nuevo intento para explicar la elección.']},
 {name:'Cooperación y acuerdos',evidence:'Comparte roles y espacio, escucha y facilita la participación de su grupo.',levels:['Comparte roles, escucha y propone acuerdos que facilitan la participación del grupo.','Respeta turnos y roles, escucha y colabora con el objetivo compartido.','Colabora de manera intermitente y necesita recordatorios para respetar turnos o acuerdos.','Necesita acompañamiento para asumir un rol y sostener los acuerdos de participación.']},
 {name:'Seguridad y autocuidado',evidence:'Aplica las medidas de seguridad acordadas y ajusta su participación cuando lo necesita.',levels:['Anticipa riesgos, aplica las medidas acordadas y propone ajustes seguros.','Aplica las medidas acordadas y comunica cuándo necesita una pausa o ajuste.','Aplica algunas medidas; necesita recordatorios para cuidar espacio, material o ritmo.','Necesita guía directa y una variante adaptada para practicar con seguridad.']},
 {name:'Uso de retroalimentación',evidence:'Prueba una sugerencia y describe qué cambia en su siguiente intento.',levels:['Selecciona una sugerencia pertinente, la prueba y explica con evidencia el cambio.','Prueba una sugerencia y reconoce un cambio en el siguiente intento.','Prueba la sugerencia con ayuda y necesita preguntas para reconocer su efecto.','Necesita una demostración adicional y acompañamiento para probar una sugerencia.']},
 {name:'Reflexión del aprendizaje',evidence:'Identifica una acción lograda y un próximo paso a partir de su experiencia.',levels:['Identifica un logro con evidencia, explica una dificultad y propone un próximo paso específico.','Identifica una acción lograda y propone un próximo paso relacionado con la tarea.','Identifica un logro o dificultad con preguntas de apoyo; el próximo paso es general.','Necesita ejemplos y preguntas concretas para expresar qué aprendió y qué puede volver a intentar.']}
 ].slice(0,n);
}

ón para ${esc(s.name)}" maxlength="1000"></td></tr>`).join('')}</tbody></table></div></section>`:''}</div><footer>Instrumento editable por el docente al volver a preparar la propuesta. Valorar el desempeño en la tarea adaptada y la evidencia disponible. No convertir automáticamente estos puntajes en calificaciones. Los registros se guardan al pulsar «Guardar instrumento».</footer></article>`;

function globalSearch(){const q=$('globalSearch').value.trim();if(!q)return;const s=state();if(s.classes.some(c=>norm(c.course+' '+c.content+' '+c.unit+' '+c.date).includes(norm(q)))){classesQuery=q;classesCourse='';classStatus='';navigate('clases')}else{resourceQuery=q;resourceCourse='';resourceAxis='';resourceFavorites=false;resourceTab=DATA.oa.some(x=>norm(x.code+' '+x.text+' '+x.course).includes(norm(q)))?'oa':'activities';navigate('recursos')}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-action]');if(!t||t.disabled)return;const a=t.dataset.action,d=t.dataset;
 try{switch(a){
 case'navigate':captureEdits();navigate(d.page);break;
 case'toggle-menu':toggleMenu();break;
 case'new-class':newClass({...d.course?{course:d.course}:{},...d.date?{date:d.date}:{},...d.time?{time:d.time}:{}});break;
 case'view-class':openClass(d.id);break;
 case'edit-class':editClass(d.id);break;
 case'duplicate-class':duplicateClass(d.id);break;
 case'delete-class':deleteClass(d.id);break;
 case'confirm-delete-class':if(mutate(s=>{s.classes=s.classes.filter(c=>c.id!==d.id)})){closeDialog();if(currentDraft?.id===d.id)currentDraft=null;navigate('clases');toast('Clase eliminada.')}break;
 case'cal-prev':shiftCalendar(-1);break;
 case'cal-next':shiftCalendar(1);break;
 case'cal-today':calDate=todayKey();calMiniMonth=null;renderCalendar();break;
 case'cal-view':calView=d.view;renderCalendar();break;
 case'cal-day':calDate=d.date;calMiniMonth=null;calView='day';renderCalendar();break;
 case'cal-jump':calDate=d.date;calMiniMonth=null;renderCalendar();break;
 case'cal-mini-prev':shiftCalendarMini(-1);break;
 case'cal-mini-next':shiftCalendarMini(1);break;
 case'new-event':eventDialog(null,d.date||calDate);break;
 case'edit-event':eventDialog(d.id);break;
 case'delete-event':if(mutate(s=>{s.events=s.events.filter(x=>x.id!==d.id)})){closeDialog();renderCurrent();toast('Fecha eliminada.')}break;
 case'resource-tab':resourceTab=d.tab;resourceAxis='';resourceQuery='';navigate('recursos');break;
 case'favorite-filter':resourceFavorites=!resourceFavorites;renderResources();break;
 case'favorite':if(mutate(s=>{const k=d.course+'|'+d.code;s.favorites=s.favorites.includes(k)?s.favorites.filter(x=>x!==k):[...s.favorites,k]}))renderResources();break;
 case'copy-oa':{const o=DATA.oa.find(x=>x.course===d.course&&x.code===d.code);if(o){try{await navigator.clipboard.writeText(o.code+' · '+o.text+'\n'+o.source);toast('OA copiado.')}catch{showDialog('Copiar objetivo',`<p>Selecciona y copia el resumen:</p><textarea readonly aria-label="Objetivo para copiar">${esc(o.code+' · '+o.text+'\n'+o.source)}</textarea>`);}}break;}
 case'use-oa':newClass({course:d.course,oaCode:d.code});break;
 case'use-activity':useActivity(d.id);break;
 case'activity-detail':activityDialog(d.id);break;
 case'course-progress':progressCourse=d.course;navigate('progreso');break;
 case'edit-plan':captureEdits();editDraft=!editDraft;renderViewer();break;
 case'edit-metadata':captureEdits();builderData=structuredClone(currentDraft);$('page-crear').innerHTML='';navigate('crear');break;
 case'save-plan':savePlan();break;
 case'save-overlap':savePlan(true);break;
 case'toggle-status':captureEdits();if(currentDraft){currentDraft.status=currentDraft.status==='done'?'planned':'done';savePlan(true)}break;
 case'export-plan':captureEdits();exportWord('planDocument','EDUFISICA_'+currentDraft.course.replace(/[^a-z0-9]/gi,'_'));break;
 case'print-plan':captureEdits();printDocument('planDocument');break;
 case'evaluate-draft':evaluateDraft();break;
 case'save-evaluation':saveEvaluation();break;
 case'open-evaluation':openEvaluation(d.id);break;
 case'delete-evaluation':showDialog('Eliminar instrumento',`<p>Se eliminarán este instrumento y sus observaciones guardadas. La clase vinculada se conservará.</p><div class="dialogfoot">${btn('Cancelar','close-dialog')}${btn('Eliminar instrumento','confirm-delete-evaluation','trash','danger',`data-id="${esc(d.id)}"`)}</div>`);break;
 case'confirm-delete-evaluation':if(mutate(s=>{s.evaluations=s.evaluations.filter(x=>x.id!==d.id)})){if(currentInstrument?.id===d.id)currentInstrument=null;closeDialog();renderEvaluation();toast('Instrumento eliminado.')}break;
 case'add-students':if(currentInstrument)showDialog('Agregar estudiantes',`<form id="addStudentsForm">${field('Un nombre o identificador por línea','studentNames','<textarea id="studentNames" name="studentNames" required maxlength="10000"></textarea>')}<div class="dialogfoot">${btn('Cancelar','close-dialog')}<button class="btn primary" type="submit">Agregar al registro</button></div></form>`);break;
 case'export-evaluation':exportWord('instrumentDocument','EDUFISICA_EVALUACION');break;
 case'print-evaluation':printDocument('instrumentDocument');break;
 case'settings':captureEdits();settingsDialog();break;
 case'close-dialog':closeDialog();break;
 case'backup':backup();break;
 case'choose-backup':$('backupFile').click();break;
 case'confirm-import':confirmImport();break;
 case'export-ics':exportICS();break;
 case'enter-demo':closeDialog();demoDB=makeDemo();currentDraft=null;currentInstrument=null;builderData=blankClass();$('page-crear').innerHTML='';calDate=todayKey();navigate('inicio');toast('Modo demostración activado. Tus clases siguen separadas.');break;
 case'exit-demo':demoDB=null;currentDraft=null;currentInstrument=null;builderData=blankClass();$('page-crear').innerHTML='';closeDialog();navigate('inicio');toast('Volviste a tus clases guardadas.');break;
 case'auth-dialog':authDialog();break;
 case'register':await submitAuth(true);break;
 case'reset-password':await resetPassword();break;
 case'logout':await logout();break;
 case'import-guest':importGuest();break;
 default:break;
 }hydrate()}catch(err){console.error('EduFísica:',err);toast('No se pudo completar la acción. Revisa tus datos y vuelve a intentarlo.',true)}
});
document.addEventListener('submit',async e=>{
 e.preventDefault();try{switch(e.target.id){
 case'searchForm':globalSearch();break;
 case'lessonForm':preparePlan();break;
 case'evalForm':makeInstrument();break;
 case'authForm':await submitAuth();break;
 case'settingsForm':if(mutate(s=>{s.settings={name:$('profileName').value.trim(),school:$('profileSchool').value.trim(),region:$('profileRegion').value}})){closeDialog();renderCurrent();renderNav();toast('Preferencias guardadas.')}break;
 case'eventForm':if(!parseDate($('eventDate').value)){toast('Revisa la fecha.',true);break}if(mutate(s=>{let v={id:eventEditingId||uid(),date:$('eventDate').value,title:$('eventTitle').value.trim(),note:$('eventNote').value.trim()},i=s.events.findIndex(x=>x.id===v.id);if(i<0)s.events.push(v);else s.events[i]=v})){closeDialog();renderCurrent();toast('Fecha importante guardada.')}break;
 case'addStudentsForm':if(currentInstrument){const names=$('studentNames').value.split('\n').map(x=>x.trim()).filter(Boolean),limit=60-currentInstrument.students.length;currentInstrument.students.push(...names.slice(0,limit).map(name=>({id:uid(),name,scores:Array(currentInstrument.criteria.length).fill(null),note:''})));closeDialog();renderInstrument();toast('Estudiantes agregados. Guarda el instrumento para conservarlos.')}break;
 }hydrate()}catch(err){console.error(err);toast('Revisa los datos antes de continuar.',true)}
});
document.addEventListener('change',e=>{const t=e.target;switch(t.id){case'course':updateBuilderOA();break;case'oaCode':showBuilderOA();break;case'evalCourse':updateEvalOA();break;case'calCourse':calCourse=t.value;renderCalendar();break;case'calJump':if(parseDate(t.value)){calDate=t.value;calMiniMonth=null;renderCalendar()}break;case'classCourse':classesCourse=t.value;renderClasses();break;case'classStatus':classStatus=t.value;renderClasses();break;case'resourceCourse':resourceCourse=t.value;renderResources();break;case'resourceAxis':resourceAxis=t.value;renderResources();break;case'progressCourse':progressCourse=t.value;renderProgress();break;case'backupFile':readBackup(t.files[0]);break}if(t.dataset.scoreStudent&&currentInstrument){const s=currentInstrument.students.find(x=>x.id===t.dataset.scoreStudent);if(s)s.scores[Number(t.dataset.index)]=t.value===''?null:Number(t.value)}hydrate()});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='classSearch'){classesQuery=t.value;preserveFilters(renderClasses,t.id)}if(t.id==='resourceSearch'){resourceQuery=t.value;preserveFilters(renderResources,t.id)}if(t.dataset.noteStudent&&currentInstrument){let s=currentInstrument.students.find(x=>x.id===t.dataset.noteStudent);if(s)s.note=t.value}});
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
window.addEventListener('storage',e=>{if(e.key===key()){loadDB();if(!['crear','ver','evaluacion'].includes(currentPage))renderCurrent();renderNav();hydrate()}});
window.addEventListener('beforeunload',e=>{if(editDraft){e.preventDefault();e.returnValue=''}});
loadDB();$('topDate').textContent=fmt(todayKey(),{weekday:'short',day:'numeric',month:'short'});updateStorageStatus();navigate('inicio');hydrate();
try{if(localStorage.getItem('edufisica_auth_enabled')==='1')initAuth().catch(()=>toast('Puedes continuar sin cuenta; no se pudo recuperar la sesión.'))}catch{}

</script>
</body></html>
